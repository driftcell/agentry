[workspace]
resolver = "3"
members = ["crates/server", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
diffy = "0.5"
flate2 = "1"
hex = "0.4"
http = "1"
mime_guess = "2"
object_store = { version = "0.13", features = ["aws"] }
percent-encoding = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.11.0", features = [
    "server",
    "transport-streamable-http-server",
] }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
    "derive",
] }
tar = "0.4"
thiserror = "2"
tiktoken-rs = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "fs",
    "compression-gzip",
    "request-id",
    "timeout",
    "limit",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
