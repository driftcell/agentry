services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: agentry
      POSTGRES_PASSWORD: agentry
      POSTGRES_DB: agentry
    ports:
      - "5433:5432"
    volumes:
      - agentry_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentry -d agentry"]
      interval: 3s
      timeout: 3s
      retries: 30

  agentry:
    image: agentry:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://agentry:agentry@postgres:5432/agentry
      SERVER_ADDR: 0.0.0.0:8080
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-http://localhost:8080}
      SERVER_ALLOWED_HOSTS: ${SERVER_ALLOWED_HOSTS:-localhost,127.0.0.1,agentry}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_SECRET_ACCESS_KEY: ${OSS_SECRET_ACCESS_KEY:-}
      OSS_VIRTUAL_HOST_STYLE: ${OSS_VIRTUAL_HOST_STYLE:-true}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  agentry_pgdata:
